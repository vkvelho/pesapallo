function help(){return '<p><b>Ulkovuoro:</b> napauta kenttää → lukkari syöttää. <b>Paina ja pidä</b> pesää tai toista pelaajaa (voit aloittaa jo ennen kuin pallo on omalla pelaajalla): vapauta kun mittari on vihreällä. Liian lyhyt = hidas heitto, liian pitkä = epätarkka. Jos vapautat ennen kiinniottoa, heitto lähtee heti kiinnioton jälkeen (keltainen rengas kohteessa). Pallo pesällä ennen etenijää = palo. <b>Kärkkyjät:</b> lukkari ei saa ottaa omaa syöttöään kiinni ilmasta. Kun vastustajan etenijä on irti pesästä, paina ja pidä pesää: <i>ennen syöttöä</i> lukkari heittää heti; <i>syötön aikana</i> mittari latautuu ja heitto lähtee, kun lukkari on nostanut lautaselle pudonneen pallon (n. 0,25 s). Kärkkyjälle tulee <b>palo</b>, jos pallo on hänen lähtöpesällään ennen kuin hän palaa pesälle, tai seuraavalla pesällä ennen kuin hän ehtii sinne.</p><p><b>Sisävuoro:</b> lukkari syöttää itse. <b>Napauta kohtaa, johon haluat lyödä</b>, kun pallo putoaa lautaselle (rengas vihertää). <b>Jokerit</b> (J1–J3, yläpalkki): vaihda lyöjä jokeriin ennen ensimmäistä syöttöä, kukin kerran vuorossa. Napauta <b>lyöjää</b> lähettääksesi hänet ykköselle ja <b>etenijää</b> lähettääksesi hänet seuraavalle pesälle. <b>Kärkkyminen:</b> ennen syöttöä napauta pesällä olevaa etenijää → hän kärkkyy (irti pesästä); napauta uudelleen → hän palaa pesälle. Syötön aikana napauta kärkkyjää → <b>lähtö</b> seuraavalle pesälle. Lukkari saa pallon vasta, kun syöttö on pudonnut lautaselle, ja heittää sitten polttoon; ⚡-juoksija ehtii useimmiten, tavallisella juoksijalla on noin puolet mahdollisuus.</p>'}
